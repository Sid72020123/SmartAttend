{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
    <main>
        <!-- Register Form -->
        <h1>Register</h1>
        <form id="registration-form"
              method="post"
              action="{{ url_for('register_user') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <div class="field">
                <label for="registration-name">Name</label>
                <input id="registration-name"
                       type="text"
                       name="name"
                       autofocus
                       autocomplete="name"
                       required />
            </div>
            <div class="field">
                <label for="registration-email">Email</label>
                <input id="registration-email"
                       type="email"
                       name="email"
                       autocomplete="new-email"
                       required />
            </div>
            <div class="field">
                <label for="registration-password">Password</label>
                <input id="registration-password"
                       type="password"
                       name="password"
                       autocomplete="new-password"
                       required />
            </div>
            <div class="field">
                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password"
                       type="password"
                       name="confirm_password"
                       autocomplete="new-password"
                       required />
            </div>
            {% if message %}
                {% if error %}
                    <div class="message error" role="alert">{{ message }}</div>
                {% else %}
                    <div class="message success" role="alert">{{ message }}</div>
                {% endif %}
            {% endif %}
            <div class="button-field">
                <button type="submit" class="form-action-button main-form-button">Register</button>
                <i>Already have an account?</i>
                <a href="{{ url_for('home') }}"
                   class="form-action-button"
                   id="show-login">Log In</a>
            </div>
        </form>
    </main>
{% endblock %}
